org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# The local build cache is left off on purpose: after renaming a res/ folder it once restored a stale
# merged-resources output (missing launcher icon). Configuration cache and incremental builds stay on.
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
