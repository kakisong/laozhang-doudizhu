<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title" style="color:#E4C994">
  <title id="title">三牌冠章</title>
  <!-- A broad three-card fan suggests the three seats; a restrained crown identifies the landlord without coins or extra ornaments. -->
  <rect width="100" height="100" rx="22" fill="#102B25"/>
  <g id="three-cards" stroke="#102B25" stroke-width="2">
    <rect x="32" y="36" width="24" height="37" rx="4" transform="rotate(-18 44 55)" fill="currentColor"/>
    <rect x="44" y="36" width="24" height="37" rx="4" transform="rotate(18 56 55)" fill="currentColor"/>
    <rect x="38" y="32" width="24" height="40" rx="4" fill="#FFFCF4"/>
  </g>
  <path d="M37 26 42 31 50 22 58 31 63 26 61 36 H39 Z" fill="currentColor"/>
  <path d="M50 60 C44 56 42 52 42 49 C42 44 48 43 50 47 C52 43 58 44 58 49 C58 52 56 56 50 60 Z" fill="#AD303E"/>
</svg>
